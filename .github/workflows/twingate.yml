name: Twingate Secrets Management

on:
  workflow_dispatch:

env:
  SERVER_USER: soniiit
  SERVER_HOST: 192.168.178.32  # Server 03

jobs:
  update-demo-secrets:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Demo Secrets
        run: |
          echo "Updating secrets for Twingate Demo Connector"
          SERVICE_NAME=twingate-connector-net-demo
          
          # Stoppe den Container
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd /home/soniiit/docker-runner/$SERVICE_NAME && docker compose down"
          
          if [ -f "docker-srv-03/$SERVICE_NAME/.env.template" ]; then
            sed -e "s|__TWINGATE_ACCESS_TOKEN__|${{ secrets.DEMO_TWINGATE_ACCESS_TOKEN }}|g" \
                -e "s|__TWINGATE_REFRESH_TOKEN__|${{ secrets.DEMO_TWINGATE_REFRESH_TOKEN }}|g" \
                docker-srv-03/$SERVICE_NAME/.env.template > \
                docker-srv-03/$SERVICE_NAME/.env
            scp -o StrictHostKeyChecking=no docker-srv-03/$SERVICE_NAME/.env ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/home/soniiit/docker-runner/$SERVICE_NAME/.env
            
            # Starte den Container neu
            ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd /home/soniiit/docker-runner/$SERVICE_NAME && docker compose up -d"
          fi

