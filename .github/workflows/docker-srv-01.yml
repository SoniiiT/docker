name: Docker Server 01 Workflow

on:
  push:
    paths:
      - 'docker-srv-01/**'
  pull_request:
    paths:
      - 'docker-srv-01/**'
  workflow_dispatch:  # Erlaube manuelles Ausführen

env:
  SERVER_USER: soniiit
  SERVER_HOST: 192.168.178.30

jobs:
  detect:
    runs-on: self-hosted
    outputs:
      action: ${{ steps.detect.outputs.action }}
      service: ${{ steps.detect.outputs.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Detect Changes
        id: detect
        run: |
          # Prüfe auf Änderungen in den Docker Compose Dateien
          if [ -n "$(git rev-list --count HEAD)" ] && [ "$(git rev-list --count HEAD)" -gt 1 ]; then
            # Suche nach gelöschten Dateien
            DELETED_FILES=$(git diff --name-only --diff-filter=D HEAD~1 HEAD | grep 'docker-srv-01/.*/docker-compose.\(yml\|yaml\)' || true)
            if [ -n "$DELETED_FILES" ]; then
              SERVICE_NAME=$(echo $DELETED_FILES | cut -d'/' -f2)
              echo "action=delete" >> $GITHUB_OUTPUT
              echo "service=$SERVICE_NAME" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            # Suche nach geänderten oder neuen Dateien
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep 'docker-srv-01/.*/docker-compose.\(yml\|yaml\)' || true)
            if [ -n "$CHANGED_FILES" ]; then
              SERVICE_NAME=$(echo $CHANGED_FILES | cut -d'/' -f2)
              if ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "[ -d /home/soniiit/docker-runner/$SERVICE_NAME ]"; then
                echo "action=update" >> $GITHUB_OUTPUT
              else
                echo "action=new" >> $GITHUB_OUTPUT
              fi
              echo "service=$SERVICE_NAME" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            # Initialer Check - prüfe alle Services
            echo "action=new" >> $GITHUB_OUTPUT
            echo "service=all" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Keine Änderungen gefunden
          echo "action=none" >> $GITHUB_OUTPUT
          echo "service=" >> $GITHUB_OUTPUT

  new:
    needs: detect
    if: needs.detect.outputs.action == 'new'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Deploy New Service(s)
        run: |
          # Wenn service=all, deploye alle Services
          if [ "${{ needs.detect.outputs.service }}" = "all" ]; then
            echo "Deploying all services to Docker Server 01"
            for SERVICE_DIR in docker-srv-01/*; do
              if [ -d "$SERVICE_DIR" ] && [ -f "$SERVICE_DIR/docker-compose.yaml" ]; then
                SERVICE_NAME=$(basename "$SERVICE_DIR")
                echo "Deploying service: $SERVICE_NAME"
                
                # Erstelle Remote-Verzeichnis
                ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "mkdir -p /home/soniiit/docker-runner/$SERVICE_NAME"
                
                # Kopiere Docker Compose Datei
                scp -o StrictHostKeyChecking=no "$SERVICE_DIR/docker-compose.yaml" ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/home/soniiit/docker-runner/$SERVICE_NAME/docker-compose.yaml
                
                # Starte den Service
                ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd /home/soniiit/docker-runner/$SERVICE_NAME && docker compose up -d"
              fi
            done
          else
            # Wenn ein spezifischer Service geändert wurde
            SERVICE_NAME=${{ needs.detect.outputs.service }}
            echo "Deploying new service: $SERVICE_NAME"
            
            # Erstelle Remote-Verzeichnis
            ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "mkdir -p /home/soniiit/docker-runner/$SERVICE_NAME"
            
            # Kopiere Docker Compose Datei
            scp -o StrictHostKeyChecking=no docker-srv-01/$SERVICE_NAME/docker-compose.yaml ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/home/soniiit/docker-runner/$SERVICE_NAME/docker-compose.yaml
            
            # Starte den Service
            ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd /home/soniiit/docker-runner/$SERVICE_NAME && docker compose up -d"
          fi

  update:
    needs: detect
    if: needs.detect.outputs.action == 'update'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Update Service
        run: |
          SERVICE_NAME=${{ needs.detect.outputs.service }}
          echo "Updating service: $SERVICE_NAME"
          
          # Stoppe den Service
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd /home/soniiit/docker-runner/$SERVICE_NAME && docker compose down"
          
          # Kopiere neue Docker Compose Datei
          scp -o StrictHostKeyChecking=no docker-srv-01/$SERVICE_NAME/docker-compose.yaml ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/home/soniiit/docker-runner/$SERVICE_NAME/docker-compose.yaml
          
          # Starte den Service neu
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd /home/soniiit/docker-runner/$SERVICE_NAME && docker compose up -d"

  delete:
    needs: detect
    if: needs.detect.outputs.action == 'delete'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Delete Service
        run: |
          SERVICE_NAME=${{ needs.detect.outputs.service }}
          echo "Deleting service: $SERVICE_NAME"
          
          # Stoppe und lösche den Service
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd /home/soniiit/docker-runner/$SERVICE_NAME && docker compose down"
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "rm -rf /home/soniiit/docker-runner/$SERVICE_NAME"

  no_changes:
    needs: detect
    if: needs.detect.outputs.action == 'none'
    runs-on: self-hosted
    steps:
      - name: No Changes Detected
        run: |
          echo "No changes detected in Docker Compose files. No action required."
          exit 1 