name: Docker LXC Remotely Workflow

on:
  push:
    paths:
      - 'lxc-remotely/**'
  pull_request:
    paths:
      - 'lxc-remotely/**'

env:
  SERVER_USER: root
  SERVER_HOST: 192.168.178.45  # IP des LXC-Containers

jobs:
  detect:
    runs-on: self-hosted
    outputs:
      action: ${{ steps.detect.outputs.action }}
      service: ${{ steps.detect.outputs.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Changes
        id: detect
        run: |
          # Prüfe auf Änderungen in den Docker Compose Dateien
          if [ -n "$(git rev-list --count HEAD)" ] && [ "$(git rev-list --count HEAD)" -gt 1 ]; then
            # Suche nach gelöschten Dateien
            DELETED_FILES=$(git diff --name-only --diff-filter=D HEAD~1 HEAD | grep 'lxc-remotely/.*/docker-compose.\(yml\|yaml\)' || true)
            if [ -n "$DELETED_FILES" ]; then
              SERVICE_NAME=$(echo $DELETED_FILES | cut -d'/' -f2)
              echo "action=delete" >> $GITHUB_OUTPUT
              echo "service=$SERVICE_NAME" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            # Suche nach geänderten oder neuen Dateien
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep 'lxc-remotely/.*/docker-compose.\(yml\|yaml\)' || true)
            if [ -n "$CHANGED_FILES" ]; then
              SERVICE_NAME=$(echo $CHANGED_FILES | cut -d'/' -f2)
              if ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "[ -d /root/docker-runner/$SERVICE_NAME ]"; then
                echo "action=update" >> $GITHUB_OUTPUT
              else
                echo "action=new" >> $GITHUB_OUTPUT
              fi
              echo "service=$SERVICE_NAME" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            # Initialer Check
            CHANGED_FILES=$(find lxc-remotely -name "docker-compose.yml" -o -name "docker-compose.yaml" 2>/dev/null || true)
            if [ -n "$CHANGED_FILES" ]; then
              SERVICE_NAME=$(echo $CHANGED_FILES | cut -d'/' -f2)
              echo "action=new" >> $GITHUB_OUTPUT
              echo "service=$SERVICE_NAME" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          
          # Prüfe auf gelöschte Verzeichnisse im aktuellen Commit
          CURRENT_DIRS=$(find lxc-remotely -type d -mindepth 1 -maxdepth 1 2>/dev/null || true)
          if [ -n "$CURRENT_DIRS" ]; then
            for dir in $CURRENT_DIRS; do
              SERVICE_NAME=$(basename $dir)
              if ! [ -f "$dir/docker-compose.yml" ] && ! [ -f "$dir/docker-compose.yaml" ]; then
                if ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "[ -d /root/docker-runner/$SERVICE_NAME ]"; then
                  echo "action=delete" >> $GITHUB_OUTPUT
                  echo "service=$SERVICE_NAME" >> $GITHUB_OUTPUT
                  exit 0
                fi
              fi
            done
          fi
          
          # Keine Änderungen gefunden
          echo "action=none" >> $GITHUB_OUTPUT
          echo "service=" >> $GITHUB_OUTPUT

  new:
    needs: detect
    if: needs.detect.outputs.action == 'new'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy New Service
        run: |
          SERVICE_NAME=${{ needs.detect.outputs.service }}
          echo "Deploying new service: $SERVICE_NAME"
          
          # Erstelle Remote-Verzeichnis
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "mkdir -p /root/docker-runner/$SERVICE_NAME"
          
          # Kopiere den kompletten Service-Ordner
          scp -o StrictHostKeyChecking=no -r lxc-remotely/$SERVICE_NAME/* ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/docker-runner/$SERVICE_NAME/
          
          # Kopiere die .env Datei separat
          if [ -f "lxc-remotely/$SERVICE_NAME/.env" ]; then
            scp -o StrictHostKeyChecking=no lxc-remotely/$SERVICE_NAME/.env ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/docker-runner/$SERVICE_NAME/
          fi
          
          # Füge die Secrets hinzu
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "echo -e '\nPOSTGRES_PASSWORD=${{ secrets.REMOTELY_POSTGRES_PASSWORD }}' >> /root/docker-runner/$SERVICE_NAME/.env"
          
          # Setze die korrekten Berechtigungen
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "chmod 600 /root/docker-runner/$SERVICE_NAME/.env"
          
          # Starte den Service
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd /root/docker-runner/$SERVICE_NAME && docker compose up -d"

  update:
    needs: detect
    if: needs.detect.outputs.action == 'update'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Update Service
        run: |
          SERVICE_NAME=${{ needs.detect.outputs.service }}
          echo "Updating service: $SERVICE_NAME"
          
          # Stoppe den Service
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd /root/docker-runner/$SERVICE_NAME && docker compose down"
          
          # Kopiere den kompletten Service-Ordner
          scp -o StrictHostKeyChecking=no -r lxc-remotely/$SERVICE_NAME/* ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/docker-runner/$SERVICE_NAME/
          
          # Lösche die alte .env Datei
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "rm -f /root/docker-runner/$SERVICE_NAME/.env"
          
          # Kopiere die .env Datei separat
          if [ -f "lxc-remotely/$SERVICE_NAME/.env" ]; then
            scp -o StrictHostKeyChecking=no lxc-remotely/$SERVICE_NAME/.env ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/docker-runner/$SERVICE_NAME/
          fi
          
          # Füge die Secrets hinzu
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "echo -e '\nPOSTGRES_PASSWORD=${{ secrets.REMOTELY_POSTGRES_PASSWORD }}' >> /root/docker-runner/$SERVICE_NAME/.env"
          
          # Setze die korrekten Berechtigungen
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "chmod 600 /root/docker-runner/$SERVICE_NAME/.env"
          
          # Starte den Service neu
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd /root/docker-runner/$SERVICE_NAME && docker compose up -d"

  delete:
    needs: detect
    if: needs.detect.outputs.action == 'delete'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Delete Service
        run: |
          SERVICE_NAME=${{ needs.detect.outputs.service }}
          echo "Deleting service: $SERVICE_NAME"
          
          # Stoppe und lösche den Service
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd /root/docker-runner/$SERVICE_NAME && docker compose down"
          ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "rm -rf /root/docker-runner/$SERVICE_NAME"

  no_changes:
    needs: detect
    if: needs.detect.outputs.action == 'none'
    runs-on: self-hosted
    steps:
      - name: No Changes Detected
        run: |
          echo "No changes detected in Docker Compose files. No action required."
          exit 1 