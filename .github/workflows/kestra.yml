name: Kestra Secrets Management

on:
  workflow_dispatch:

env:
  SERVER_USER: soniiit
  SERVER_HOST: 192.168.178.30  # Server 01
  SERVICE_NAME: kestra

jobs:
  update-kestra-secrets:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Kestra Secrets
        run: |
          echo "Updating secrets for Kestra"
          
          # Erstelle .env Datei mit den Secrets
          if [ -f "docker-srv-01/${{ env.SERVICE_NAME }}/.env.template" ]; then
            # Ersetze alle Platzhalter mit den entsprechenden Secrets
            sed -e "s|__SSH_KEY__|${{ secrets.KESTRA_SSH_KEY }}|g" \
                docker-srv-01/${{ env.SERVICE_NAME }}/.env.template > \
                docker-srv-01/${{ env.SERVICE_NAME }}/.env
            
            # Kopiere die .env Datei auf den Server
            scp -o StrictHostKeyChecking=no docker-srv-01/${{ env.SERVICE_NAME }}/.env ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/home/soniiit/docker-runner/${{ env.SERVICE_NAME }}/.env
            
            echo "Secrets updated successfully"
          else
            echo "No .env.template found for Kestra"
            exit 1
          fi 