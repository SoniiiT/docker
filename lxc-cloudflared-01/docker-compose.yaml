version: "3.3"
services:
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    container_name: cloudflared
    restart: unless-stopped
    sysctls:
      - net.ipv4.ping_group_range=0 65535
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN_01}
    command: tunnel --no-autoupdate run
