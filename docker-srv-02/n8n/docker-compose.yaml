version: "3"

services:
  n8n:
    image: n8nio/n8n:2.39.8
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_HOST=n8n.soniiit.net
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.soniiit.net
      - N8N_SECURE_COOKIE=false
    volumes:
      - /mnt/docker/n8n_data:/home/node/.n8n
