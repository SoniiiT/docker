version: "3.9"

services:
  wallos:
    image: bellamy/wallos:5.7.1
    container_name: wallos
    restart: unless-stopped
    ports:
      - "8282:80"
    environment:
      - TZ=Europe/Berlin
    volumes:
      - /mnt/docker/wallos/db:/var/www/html/db
      - /mnt/docker/wallos/logos:/var/www/html/images/uploads/logos
