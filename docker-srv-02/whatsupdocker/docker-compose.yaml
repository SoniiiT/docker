services:
  wud:
    image: getwud/wud:latest
    container_name: wud
    ports: ["3000:3000"]
    environment:
      # Lokaler Host (optional)
      - WUD_WATCHER_LOCAL_SOCKET=/var/run/docker.sock

      # Remote #1 (dein Beispiel)
      - WUD_WATCHER_SRV01_HOST=192.168.178.30
      - WUD_WATCHER_SRV01_PORT=2375

      # weiterer Remote (falls vorhanden)
      - WUD_WATCHER_SRV03_HOST=192.168.178.32
      - WUD_WATCHER_SRV03_PORT=2375

      # optional: alle Minute scannen, um sofort was zu sehen
      - WUD_WATCHER_SRV01_CRON=* * * * *
      - WUD_WATCHER_SRV03_CRON=* * * * *
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
