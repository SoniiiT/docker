version: '3'
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Berlin
    volumes:
      - /mnt/jellyfin/jellyfin/config:/config
      - /mnt/jellyfin/jellyfin/tvseries:/data/Shows
      - /mnt/jellyfin/jellyfin/movies:/data/Movies
      - /mnt/jellyfin/jellyfin/music:/data/Music
      - /mnt/jellyfin/jellyfin/plugins:/plugins
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
    restart: unless-stopped

  jellyfin-vue:
    image: jellyfin/jellyfin-vue:unstable
    container_name: jellyfin-vue
    ports:
      - 8645:80
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Berlin
    volumes:
      - /mnt/jellyfin/sonarr/config:/config
      - /mnt/jellyfin/jellyfin/tvseries:/tv
      - /mnt/jellyfin/media/downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Berlin
    volumes:
      - /mnt/jellyfin/radarr/config:/config
      - /mnt/jellyfin/jellyfin/movies:/movies
      - /mnt/jellyfin/media/downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Berlin
    volumes:
      - /mnt/jellyfin/prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/Berlin
    ports:
      - 5055:5055
    volumes:
      - /mnt/jellyfin/jellyseerr/config:/app/config
    restart: unless-stopped

  sabnzbd:
    image: linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Berlin
    volumes:
      - /mnt/jellyfin/sabnzbd/config:/config
      - /mnt/jellyfin/media/downloads:/downloads
      - /mnt/jellyfin/sabnzbd/downloads-incomplete:/downloads/incomplete-downloads
    ports:
      - 8060:8080
    restart: unless-stopped

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Berlin
      - WEBUI_PORT=8070
      - TORRENTING_PORT=6881
    volumes:
      - /mnt/jellyfin/qbittorrent/config:/config
      - /mnt/jellyfin/media/downloads:/downloads
    ports:
      - 8070:8070
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped