services:
  twingate-connector-net-app:
    image: twingate/connector:1.88.0
    container_name: twingate-connector-net-app
    restart: unless-stopped
    pull_policy: always
    environment:
      - TWINGATE_NETWORK=soniiit
      - TWINGATE_ACCESS_TOKEN=${TWINGATE_ACCESS_TOKEN_APP}
      - TWINGATE_REFRESH_TOKEN=${TWINGATE_REFRESH_TOKEN_APP}
      - TWINGATE_LABEL_HOSTNAME=${HOSTNAME}
      - TWINGATE_LABEL_DEPLOYED_BY=docker
    dns:
      - 192.168.178.3
