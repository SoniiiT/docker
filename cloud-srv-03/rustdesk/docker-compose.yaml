version: "3.9"

# RustDesk Self-Hosted Server
# Ports are exposed directly — Traefik cannot handle UDP (port 21116/udp),
# so all RustDesk protocol ports bypass Traefik and are bound directly.
#
# Client config (default ports are assumed automatically — no need to specify them):
#   ID Server:    rustdesk.soniiit.net
#   Relay Server: rustdesk.soniiit.net
#   Key:          see ./data/id_ed25519.pub after first start
#
# DNS: Add an A record  rustdesk.soniiit.net → <cloud-srv-03 public IP>
# Traefik is NOT involved — RustDesk ports are bound directly on the host.

networks:
  rustdesk:
    name: rustdesk
    driver: bridge

services:
  hbbs:
    image: rustdesk/rustdesk-server:1.1.15
    container_name: rustdesk-hbbs
    command: hbbs
    restart: unless-stopped
    networks: [rustdesk]
    ports:
      - "21115:21115"       # NAT type test (TCP)
      - "21116:21116"       # ID registration & heartbeat (TCP)
      - "21116:21116/udp"   # Hole punching (UDP) — cannot go through Traefik
      - "21118:21118"       # WebSocket for browser-based RustDesk client (TCP)
    volumes:
      - ./data:/root
    environment:
      TZ: Europe/Berlin
    depends_on:
      - hbbr

  hbbr:
    image: rustdesk/rustdesk-server:1.1.15
    container_name: rustdesk-hbbr
    command: hbbr
    restart: unless-stopped
    networks: [rustdesk]
    ports:
      - "21117:21117"       # Relay (TCP)
      - "21119:21119"       # WebSocket for browser-based RustDesk client (TCP)
    volumes:
      - ./data:/root
    environment:
      TZ: Europe/Berlin
