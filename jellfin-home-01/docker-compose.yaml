version: '3'
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Berlin
    volumes:
      - /mnt/jellyfin/jellyfin/config:/config
      - /mnt/jellyfin/jellyfin/tvseries:/data/Shows
      - /mnt/jellyfin/jellyfin/movies:/data/Movies
      - /mnt/jellyfin/jellyfin/music:/data/Music
      - /mnt/jellyfin/jellyfin/plugins:/plugins
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
    restart: unless-stopped

  jellyfin-vue:
    image: jellyfin/jellyfin-vue:unstable
    container_name: jellyfin-vue
    ports:
      - 8645:80
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Berlin
    volumes:
      - /mnt/jellyfin/sonarr/config:/config
      - /mnt/jellyfin/jellyfin/tvseries:/tv
      - /mnt/jellyfin/media/downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Berlin
    volumes:
      - /mnt/jellyfin/radarr/config:/config
      - /mnt/jellyfin/jellyfin/movies:/movies
      - /mnt/jellyfin/media/downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Berlin
    volumes:
      - /mnt/jellyfin/prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/Berlin
      - PORT=5055
    ports:
      - 5055:5055
    volumes:
      # Keep existing Jellyseerr host path to preserve current config/data during migration.
      - /mnt/jellyfin/jellyseerr/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:$${PORT:-5055}/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  sabnzbd:
    image: linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Berlin
    volumes:
      - /mnt/jellyfin/sabnzbd/config:/config
      - /mnt/jellyfin/media/downloads:/downloads
      - /mnt/jellyfin/sabnzbd/downloads-incomplete:/downloads/incomplete-downloads
    ports:
      - 8060:8080
    restart: unless-stopped

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Berlin
      - WEBUI_PORT=8070
      - TORRENTING_PORT=6881
    volumes:
      - /mnt/jellyfin/qbittorrent/config:/config
      - /mnt/jellyfin/media/downloads:/downloads
    ports:
      - 8070:8070
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  kapowarr:
    image: mrcas/kapowarr:latest
    container_name: kapowarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Berlin
    volumes:
      - kapowarr-db:/app/db
      - /mnt/jellyfin/kapowarr/downloads:/app/temp_downloads
      - /mnt/jellyfin/kapowarr/comics:/comics
    ports:
      - 5656:5656
    restart: unless-stopped

  kaizoku-pg:
    image: postgres:16-alpine
    container_name: kaizoku-pg
    environment:
      - POSTGRES_USER=kaizoku
      - POSTGRES_PASSWORD=kaizoku
      - POSTGRES_DB=kaizoku
    volumes:
      - kaizoku-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaizoku"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kaizoku-redis:
    image: redis:7-alpine
    container_name: kaizoku-redis
    restart: unless-stopped

  kaizoku:
    image: ghcr.io/oae/kaizoku:latest
    container_name: kaizoku
    environment:
      - DATABASE_URL=postgresql://kaizoku:kaizoku@kaizoku-pg:5432/kaizoku
      - REDIS_HOST=kaizoku-redis
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /mnt/jellyfin/manga:/data
      - /mnt/jellyfin/kaizoku/config:/config
      - /mnt/jellyfin/kaizoku/logs:/logs
    ports:
      - 3000:3000
    depends_on:
      kaizoku-pg:
        condition: service_healthy
    restart: unless-stopped

  komga:
    image: gotson/komga:latest
    container_name: komga
    environment:
      - TZ=Europe/Berlin
    volumes:
      - /mnt/jellyfin/komga/config:/config
      - /mnt/jellyfin/manga:/manga
    ports:
      - 25600:25600
    restart: unless-stopped

volumes:
  kapowarr-db:
  kaizoku-pg-data:
