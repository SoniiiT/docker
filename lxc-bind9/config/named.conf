include "/etc/bind/named.conf.key";

acl internal {
    192.168.178.0/24;
};

options {
    directory "/var/cache/bind";
    
    forwarders {
        192.168.178.1;
    };
    
    allow-query {
        internal;
    };
    
    listen-on { 
        any; 
    };
    listen-on-v6 { 
        any; 
    };
    
    recursion yes;
    allow-recursion { 
        internal; 
    };
};

zone "home.soniiit.net" IN {
    type master;
    file "/etc/bind/home-soniiit-net.zone";
    allow-update { 
        key "tsig-key"; 
    };
};

zone "dev.soniiit.net" IN {
    type master;
    file "/etc/bind/dev-soniiit-net.zone";
    allow-update { 
        key "tsig-key"; 
    };
};

zone "demo.soniiit.net" IN {
    type master;
    file "/etc/bind/demo-soniiit-net.zone";
    allow-update { 
        key "tsig-key";
    };
};

zone "178.168.192.in-addr.arpa" IN {
    type master;
    file "/etc/bind/rev-192-168-178.zone";
    allow-update { 
        key "tsig-key"; 
    };
};