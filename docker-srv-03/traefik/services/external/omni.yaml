http:
  routers:
    omni:
      rule: Host(`omni.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
        domains:
          - main: omni.soniiit.net
            sans:
              - "*.omni.soniiit.net"
      service: omni-svc
      middlewares: [secureHeaders@file]

    omni-api:
      rule: Host(`api.omni.soniiit.net`)
      entryPoints: [websecure]
      tls: {}
      service: omni-api-svc
      middlewares: [secureHeaders@file]

    omni-kube:
      rule: Host(`kube.omni.soniiit.net`)
      entryPoints: [websecure]
      tls: {}
      service: omni-kube-svc
      middlewares: [secureHeaders@file]

  services:
    omni-svc:
      loadBalancer:
        servers:
          - url: http://192.168.178.45:8080
        passHostHeader: true
    omni-api-svc:
      loadBalancer:
        servers:
          - url: http://192.168.178.45:8090
        passHostHeader: true
    omni-kube-svc:
      loadBalancer:
        servers:
          - url: http://192.168.178.45:8100
        passHostHeader: true