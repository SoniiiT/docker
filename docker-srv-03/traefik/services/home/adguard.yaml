http:
  routers:
    adguard:
      rule: Host(`adguard.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: adguard-svc
      middlewares: [secureHeaders@file]

  services:
    adguard-svc:
      loadBalancer:
        servers:
          - url: http://192.168.178.7:80
        passHostHeader: true