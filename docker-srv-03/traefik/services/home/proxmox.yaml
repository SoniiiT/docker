http:
  routers:
    proxmox:
      rule: Host(`proxmox.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: proxmox-svc
      middlewares:
        - pveHeaders@file

  services:
    proxmox-svc:
      loadBalancer:
        servers:
          - url: https://192.168.178.6:8006
        passHostHeader: true
        serversTransport: proxmox-transport

  serversTransports:
    proxmox-transport:
      insecureSkipVerify: true