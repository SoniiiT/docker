http:
  routers:
    wud:
      rule: Host(`wud.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: wud-svc
      middlewares:
        - secureHeaders@file

  services:
    wud-svc:
      loadBalancer:
        servers:
          - url: http://192.168.178.31:3000
        passHostHeader: true