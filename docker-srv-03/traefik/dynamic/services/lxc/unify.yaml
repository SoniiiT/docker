http:
  routers:
    unifi:
      rule: Host(`unifi.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: unifi-svc
      middlewares:
        - pveHeaders@file

  services:
    unifi-svc:
      loadBalancer:
        servers:
          - url: https://192.168.178.51:8443
        passHostHeader: true
        serversTransport: unifi-transport

  serversTransports:
    unifi-transport:
      insecureSkipVerify: true