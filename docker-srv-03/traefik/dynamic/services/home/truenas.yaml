http:
  routers:
    truenas:
      rule: Host(`truenas.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: truenas-svc
      middlewares: [secureHeaders@file]

  services:
    truenas-svc:
      loadBalancer:
        servers:
          - url: http://192.168.178.9:80
        passHostHeader: true