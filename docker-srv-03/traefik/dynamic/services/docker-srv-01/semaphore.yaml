http:
  routers:
    semaphore:
      rule: Host(`semaphore.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: semaphore-svc
      middlewares:
        - secureHeaders@file

  services:
    semaphore-svc:
      loadBalancer:
        servers:
          - url: http://192.168.178.30:3001
        passHostHeader: true