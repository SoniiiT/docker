http:
  routers:
    homepage:
      rule: Host(`homepage.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: homepage-svc
      middlewares:
        - secureHeaders@file

  services:
    homepage-svc:
      loadBalancer:
        servers:
          - url: http://192.168.178.30:3000
        passHostHeader: true