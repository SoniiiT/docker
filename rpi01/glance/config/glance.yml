      - size: small
        widgets:
          - type: group
            widgets:
              - type: custom-api
                title: Wallos
                url: ${WALLOS_URL}/api/subscriptions/get_subscriptions.php
                cache: 1h
                parameters:
                  apiKey: ${WALLOS_API_KEY}
                  sort: next_payment
                  state: 0
                  convert_currency: true
                template: |
                  <ul class="list list-gap-10 collapsible-container" data-collapse-after="3">
                    {{ range .JSON.Array "subscriptions" }}
                      <li>
                        <div class="flex justify-between">
                          <span class="size-h4">{{ .String "name" }}</span>
                          <span class="color-highlight shrink-0">{{ .Float "price" | printf "%.2f" }} €</span>
                        </div>
                        <ul class="list-horizontal-text">
                          <li {{ .String "next_payment" | parseTime "2006-01-02" | toRelativeTime }}></li>
                          <li>{{ .String "category_name" }}</li>
                        </ul>
                      </li>
                    {{ end }}
                  </ul>

              - type: custom-api
                title: GitHub Actions
                url: https://api.github.com/repos/SoniiiT/docker/actions/runs
                cache: 5m
                parameters:
                  exclude_pull_requests: true
                  per_page: 8
                headers:
                  Authorization: Bearer ${GITHUB_TOKEN}
                  Accept: application/vnd.github.v3+json
                  User-Agent: Glance-Dashboard
                template: |
                  <ul class="list list-gap-14 collapsible-container" data-collapse-after="5">
                    {{ range .JSON.Array "workflow_runs" }}
                      {{ $conclusion := .String "conclusion" }}
                      <li>
                        <a class="size-h4 color-primary-if-not-visited" href="{{ .String "html_url" }}">{{ .String "display_title" }}</a>
                        <ul class="list-horizontal-text">
                          <li {{ .String "updated_at" | parseTime "rfc3339" | toRelativeTime }}></li>
                          <li>{{ .String "name" }}</li>
                          <li>
                            {{ if eq $conclusion "success" }}
                              <svg width="16" height="16" fill="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd" /></svg>
                            {{ else if eq $conclusion "failure" }}
                              <svg width="16" height="16" fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" /></svg>
                            {{ else }}
                              <svg width="16" height="16" fill="var(--color-subtext)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm-.75-4.75a.75.75 0 0 0 1.5 0V8.75a.75.75 0 0 0-1.5 0v4.5Zm.75-8.5A1 1 0 1 0 10 7a1 1 0 0 0 0-2Z" clip-rule="evenodd" /></svg>
                            {{ end }}
                          </li>
                        </ul>
                      </li>
                    {{ end }}
                  </ul>

          - type: custom-api
            title: Speedtest
            cache: 30m
            url: http://192.168.178.30:8765/api/speedtest/latest
            template: |
              <div class="flex justify-between text-center">
                <div>
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.download" | printf "%.0f" }}</div>
                  <div class="size-h6">DOWN</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.upload" | printf "%.0f" }}</div>
                  <div class="size-h6">UP</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.ping" | printf "%.0f" }}</div>
                  <div class="size-h6">PING</div>
                </div>
              </div>

          - type: group
            widgets:
              - type: markets
                title: Crypto
                markets:
                  - symbol: BTC-EUR
                    name: Bitcoin
                  - symbol: ETH-EUR
                    name: Ethereum
                  - symbol: USDT-EUR
                    name: Tether
                  - symbol: BNB-EUR
                    name: BNB
                  - symbol: XRP-EUR
                    name: XRP

              - type: markets
                title: Stocks
                markets:
                  - symbol: NVDA
                    name: NVIDIA
                  - symbol: AMD
                    name: AMD
                  - symbol: GOOG
                    name: Alphabet C
                  - symbol: AAPL
                    name: Apple
                  - symbol: SAP
                    name: SAP

              - type: custom-api
                title: Nearby Aircraft
                cache: 5m
                url: https://opensky-network.org/api/states/all
                parameters:
                  lamin: "48.55"
                  lamax: "49.05"
                  lomin: "8.93"
                  lomax: "9.43"
                template: |
                  {{ $states := .JSON.Array "states" }}
                  {{ $count := len $states }}
                  <div class="margin-block-2">
                    <div class="size-h6">FLUGZEUGE IN DER NÄHE: {{ $count }}</div>
                  </div>
                  {{ if gt $count 0 }}
                    <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
                      {{ range $states }}
                        {{ $callsign := .String "1" }}
                        {{ $icao24 := .String "0" }}
                        {{ $origin := .String "2" }}
                        {{ $onGround := .Bool "8" }}
                        {{ $altitude := .Float "7" }}
                        {{ $speed := .Float "9" }}
                        <li>
                          <div class="flex justify-between">
                            <span class="size-h4 color-highlight">{{ if ne $callsign "" }}{{ $callsign | trimSpace }}{{ else }}{{ $icao24 }}{{ end }}</span>
                            {{ if ne $origin "" }}<span class="size-h6 color-subtext">{{ $origin }}</span>{{ end }}
                          </div>
                          <ul class="list-horizontal-text">
                            {{ if $onGround }}<li>Am Boden</li>{{ else }}
                              {{ if ne $altitude 0.0 }}<li>{{ printf "%.0f" $altitude }}m</li>{{ end }}
                              {{ if ne $speed 0.0 }}<li>{{ printf "%.0f" $speed }}m/s</li>{{ end }}
                            {{ end }}
                          </ul>
                        </li>
                      {{ end }}
                    </ul>
                  {{ else }}
                    <p class="color-subtext size-h5">Keine Flugzeuge in der Nähe</p>
                  {{ end }}

  - name: Internal Services
    columns:
      - size: small
        widgets:
          - type: monitor
            title: Infrastruktur
            cache: 1m
            sites:
              - title: Fritz!Box
                url: http://192.168.178.1
                icon: si:fritz
              - title: Proxmox
                url: https://192.168.178.6:8006/
                allow-insecure: true
                icon: si:proxmox

          - type: custom-api
            title: Docker Servers
            cache: 30s
            url: https://192.168.178.30:9443/api/endpoints
            headers:
              X-API-Key: ${PORTAINER_API_KEY}
            allow-insecure: true
            subrequests:
              srv01:
                url: https://192.168.178.30:9443/api/endpoints/3/docker/containers/json
                parameters:
                  all: "true"
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv01-s:
                url: https://192.168.178.30:9443/api/endpoints/3/docker/containers/json
                parameters:
                  all: "true"
                  filters: '{"status":["exited"]}'
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv01-u:
                url: https://192.168.178.30:9443/api/endpoints/3/docker/containers/json
                parameters:
                  filters: '{"health":["unhealthy"]}'
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv01-st:
                url: https://192.168.178.30:9443/api/endpoints/3/docker/containers/json
                parameters:
                  filters: '{"health":["starting"]}'
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv02:
                url: https://192.168.178.30:9443/api/endpoints/4/docker/containers/json
                parameters:
                  all: "true"
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv02-s:
                url: https://192.168.178.30:9443/api/endpoints/4/docker/containers/json
                parameters:
                  all: "true"
                  filters: '{"status":["exited"]}'
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv02-u:
                url: https://192.168.178.30:9443/api/endpoints/4/docker/containers/json
                parameters:
                  filters: '{"health":["unhealthy"]}'
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv02-st:
                url: https://192.168.178.30:9443/api/endpoints/4/docker/containers/json
                parameters:
                  filters: '{"health":["starting"]}'
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv03:
                url: https://192.168.178.30:9443/api/endpoints/5/docker/containers/json
                parameters:
                  all: "true"
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv03-s:
                url: https://192.168.178.30:9443/api/endpoints/5/docker/containers/json
                parameters:
                  all: "true"
                  filters: '{"status":["exited"]}'
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv03-u:
                url: https://192.168.178.30:9443/api/endpoints/5/docker/containers/json
                parameters:
                  filters: '{"health":["unhealthy"]}'
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv03-st:
                url: https://192.168.178.30:9443/api/endpoints/5/docker/containers/json
                parameters:
                  filters: '{"health":["starting"]}'
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
            template: |
              {{ $root := . }}
              <ul class="list list-gap-14">
              {{ range .JSON.Array "" -}}
                {{ $id := .Int "Id" -}}
                {{ $name := .String "Name" -}}
                {{ $online := eq (.Int "Status") 1 -}}
                {{ $k := "srv01" }}{{ $ks := "srv01-s" }}{{ $ku := "srv01-u" }}{{ $kst := "srv01-st" -}}
                {{ if eq $id 4 }}{{ $k = "srv02" }}{{ $ks = "srv02-s" }}{{ $ku = "srv02-u" }}{{ $kst = "srv02-st" }}{{ end -}}
                {{ if eq $id 5 }}{{ $k = "srv03" }}{{ $ks = "srv03-s" }}{{ $ku = "srv03-u" }}{{ $kst = "srv03-st" }}{{ end -}}
                {{ $total := 0 }}{{ $stoppedCnt := 0 }}{{ $unhealthyCnt := 0 }}{{ $startingCnt := 0 -}}
                {{ if $online -}}
                  {{ $sr := $root.Subrequest $k -}}
                  {{ $total = len ($sr.JSON.Array "") -}}
                  {{ $srs := $root.Subrequest $ks -}}
                  {{ $stoppedCnt = len ($srs.JSON.Array "") -}}
                  {{ $sru := $root.Subrequest $ku -}}
                  {{ $unhealthyCnt = len ($sru.JSON.Array "") -}}
                  {{ $srst := $root.Subrequest $kst -}}
                  {{ $startingCnt = len ($srst.JSON.Array "") -}}
                {{ end -}}
                {{ $healthyCnt := sub (sub (sub $total $stoppedCnt) $unhealthyCnt) $startingCnt -}}
                <li>
                  <div class="flex items-center justify-between">
                    <span class="color-highlight size-h4">{{ $name }}</span>
                    {{ if $online }}<span class="color-positive size-h6">● online</span>{{ else }}<span class="color-negative size-h6">● offline</span>{{ end }}
                  </div>
                  {{ if $online -}}
                  <ul class="list-horizontal-text size-h6">
                    <li>{{ $total }} total</li>
                    <li class="color-positive">{{ $healthyCnt }} healthy</li>
                    {{ if gt $startingCnt 0 }}<li class="color-highlight">{{ $startingCnt }} starting</li>{{ end }}
                    {{ if gt $unhealthyCnt 0 }}<li class="color-warn">{{ $unhealthyCnt }} unhealthy</li>{{ end }}
                    {{ if gt $stoppedCnt 0 }}<li class="color-negative">{{ $stoppedCnt }} stopped</li>{{ end }}
                  </ul>
                  {{ end -}}
                </li>
              {{ end -}}
              </ul>

          - type: custom-api
            title: Uptime Kuma – Services
            cache: 1m
            url: http://192.168.178.30:3001/api/status-page/heartbeat/services
            template: |
              {{ $up := 0 }}{{ $down := 0 -}}
              {{ range .JSON.Array "heartbeatList.@values.#.#-1" -}}
                {{ if eq (.Int "status") 1 }}{{ $up = add $up 1 }}{{ else }}{{ $down = add $down 1 }}{{ end -}}
              {{ end -}}
              <div class="flex justify-between text-center">
                <div>
                  <div class="color-positive size-h3">{{ $up }}</div>
                  <div class="size-h6">ONLINE</div>
                </div>
                <div>
                  <div class="{{ if gt $down 0 }}color-negative{{ else }}color-highlight{{ end }} size-h3">{{ $down }}</div>
                  <div class="size-h6">OFFLINE</div>
                </div>
              </div>

          - type: custom-api
            title: GitHub – Trending Diese Woche
            cache: 6h
            template: |
              {{ $weekAgo := offsetNow "-168h" | formatTime "2006-01-02" -}}
              {{ $repos := newRequest "https://api.github.com/search/repositories"
                  | withParameter "q" (concat "created:>" $weekAgo)
                  | withParameter "sort" "stars"
                  | withParameter "order" "desc"
                  | withParameter "per_page" "5"
                  | withHeader "Authorization" "Bearer ${GITHUB_TOKEN}"
                  | withHeader "Accept" "application/vnd.github.v3+json"
                  | withHeader "User-Agent" "Glance-Dashboard"
                  | getResponse -}}
              <ul class="list list-gap-10">
                {{ range $repos.JSON.Array "items" -}}
                  <li>
                    <a class="size-h4 color-highlight" href="{{ .String "html_url" }}" target="_blank">{{ .String "full_name" }}</a>
                    <ul class="list-horizontal-text size-h6">
                      <li>⭐ {{ .Int "stargazers_count" | formatNumber }}</li>
                      <li>{{ .String "language" }}</li>
                    </ul>
                  </li>
                {{ end -}}
              </ul>

      - size: full
        widgets:
          - type: group
            widgets:
              - type: custom-api
                title: Jellyfin
                cache: 1h
                url: http://192.168.178.98:8096/Items/Counts
                headers:
                  X-Emby-Token: ${JELLYFIN_API_KEY}
                template: |
                  <div class="flex justify-between text-center">
                    <div>
                      <div class="color-highlight size-h3">{{ .JSON.Int "MovieCount" | formatNumber }}</div>
                      <div class="size-h6">FILME</div>
                    </div>
                    <div>
                      <div class="color-highlight size-h3">{{ .JSON.Int "SeriesCount" | formatNumber }}</div>
                      <div class="size-h6">SERIEN</div>
                    </div>
                    <div>
                      <div class="color-highlight size-h3">{{ .JSON.Int "EpisodeCount" | formatNumber }}</div>
                      <div class="size-h6">EPISODEN</div>
                    </div>
                  </div>

              - type: custom-api
                title: Sonarr
                cache: 30m
                url: http://192.168.178.98:8989/api/v3/series
                headers:
                  X-Api-Key: ${SONARR_API_KEY}
                subrequests:
                  missing:
                    url: http://192.168.178.98:8989/api/v3/wanted/missing
