              - type: custom-api
                title: Following
                cache: 15m
                url: https://api.github.com/users/SoniiiT/received_events
                parameters:
                  per_page: "50"
                headers:
                  Authorization: Bearer ${GITHUB_TOKEN}
                  Accept: application/vnd.github.v3+json
                  User-Agent: Glance-Dashboard
                template: |
                  <ul class="list list-gap-14 collapsible-container" data-collapse-after="2">
                    {{ range .JSON.Array "" -}}
                      {{ $type := .String "type" -}}
                      {{ $actor := .String "actor.login" -}}
                      {{ $repo := .String "repo.name" -}}
                      {{ if and (ne $actor "SoniiiT") (or (eq $type "WatchEvent") (eq $type "ForkEvent") (eq $type "ReleaseEvent") (eq $type "CreateEvent") (eq $type "PublicEvent") (eq $type "PushEvent")) -}}
                      <li>
                        <div class="flex items-center gap-8">
                          <img src="{{ .String "actor.avatar_url" }}" width="20" height="20" style="border-radius:50%" />
                          <a class="size-h4 color-highlight" href="https://github.com/{{ $actor }}" target="_blank">{{ $actor }}</a>
                        </div>
                        <ul class="list-horizontal-text size-h6">
                          <li>{{ $type | trimSuffix "Event" }}</li>
                          <li><a href="https://github.com/{{ $repo }}" target="_blank" class="color-subtext">{{ $repo }}</a></li>
                          <li {{ .String "created_at" | parseTime "rfc3339" | toRelativeTime }}></li>
                        </ul>
                      </li>
                      {{ end -}}
                    {{ end -}}
                  </ul>

              - type: custom-api
                title: Starred
                cache: 1h
                url: https://api.github.com/users/SoniiiT/starred
                parameters:
                  per_page: "10"
                  sort: created
                  direction: desc
                headers:
                  Authorization: Bearer ${GITHUB_TOKEN}
                  Accept: application/vnd.github.v3+json
                  User-Agent: Glance-Dashboard
                template: |
                  <ul class="list list-gap-10 collapsible-container" data-collapse-after="2">
                    {{ range .JSON.Array "" -}}
                      <li>
                        <a class="size-h4 color-highlight" href="{{ .String "html_url" }}" target="_blank">{{ .String "full_name" }}</a>
                        <ul class="list-horizontal-text size-h6">
                          <li>⭐ {{ .Int "stargazers_count" | formatNumber }}</li>
                          <li>{{ .String "language" }}</li>
                        </ul>
                      </li>
                    {{ end -}}
                  </ul>

              - type: custom-api
                title: Watched
                cache: 1h
                url: https://api.github.com/users/SoniiiT/subscriptions
                parameters:
                  per_page: "10"
                headers:
                  Authorization: Bearer ${GITHUB_TOKEN}
                  Accept: application/vnd.github.v3+json
                  User-Agent: Glance-Dashboard
                template: |
                  <ul class="list list-gap-10 collapsible-container" data-collapse-after="2">
                    {{ range .JSON.Array "" -}}
                      <li>
                        <a class="size-h4 color-highlight" href="{{ .String "html_url" }}" target="_blank">{{ .String "full_name" }}</a>
                        <ul class="list-horizontal-text size-h6">
                          <li>⭐ {{ .Int "stargazers_count" | formatNumber }}</li>
                          <li>{{ .String "language" }}</li>
                        </ul>
                      </li>
                    {{ end -}}
                  </ul>

      - size: small
        widgets:
          - type: custom-api
            title: Proxmox – Status
            cache: 1m
            url: https://192.168.178.6:8006/api2/json/nodes/pve-srv-01/status
            allow-insecure: true
            headers:
              Authorization: PVEAPIToken=${PROXMOX_API_TOKEN}
            template: |
              {{ $cpu := mul (.JSON.Float "data.cpu") 100 -}}
              {{ $memUsed := .JSON.Float "data.memory.used" -}}
              {{ $memTotal := .JSON.Float "data.memory.total" -}}
              {{ $memPct := mul (div $memUsed $memTotal) 100 -}}
              {{ $diskUsed := .JSON.Float "data.rootfs.used" -}}
              {{ $diskTotal := .JSON.Float "data.rootfs.total" -}}
              {{ $diskPct := mul (div $diskUsed $diskTotal) 100 -}}
              <div class="flex justify-between text-center">
                <div>
                  <div class="color-highlight size-h3">{{ $cpu | printf "%.0f" }}%</div>
                  <div class="size-h6">CPU</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ $memPct | printf "%.0f" }}%</div>
                  <div class="size-h6">RAM</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ $diskPct | printf "%.0f" }}%</div>
                  <div class="size-h6">DISK</div>
                </div>
              </div>

          - type: custom-api
            title: N8N – Aktive Workflows
            cache: 5m
            url: https://n8n.soniiit.net/api/v1/workflows
            headers:
              X-N8N-API-KEY: ${N8N_API_KEY}
            template: |
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
                {{ range .JSON.Array "data" -}}
                  {{ if not (.Bool "isArchived") -}}
                  <li>
                    <div class="flex justify-between">
                      <span class="size-h4">{{ .String "name" }}</span>
                      {{ if .Bool "active" -}}
                      <span class="color-positive size-h6">● aktiv</span>
                      {{ else -}}
                      <span class="color-subtext size-h6">● inaktiv</span>
                      {{ end -}}
                    </div>
                  </li>
                  {{ end -}}
                {{ end -}}
              </ul>

          - type: custom-api
            title: WireGuard Tunnels
            cache: 1m
            url: http://192.168.178.45:10086/api/getWireguardConfigurations
            headers:
              wg-dashboard-apikey: ${WGD_API_KEY}
            template: |
              <ul class="list list-gap-14">
                {{ range .JSON.Array "data" -}}
                  {{ $total := .Int "TotalPeers" -}}
                  {{ $connected := .Int "ConnectedPeers" -}}
                  {{ $disconnected := sub $total $connected -}}
                  <li>
                    <div class="flex justify-between">
                      <span class="size-h4 color-highlight">{{ .String "Name" }}</span>
                    </div>
                    <ul class="list-horizontal-text size-h6">
                      <li class="color-positive">{{ $connected }} verbunden</li>
                      <li class="color-subtext">{{ $disconnected }} getrennt</li>
                    </ul>
                  </li>
                {{ end -}}
              </ul>

          - type: custom-api
            title: Semaphore – Letzte Runs
            cache: 2m
            url: http://192.168.178.50:3000/api/project/2/tasks
            headers:
              Authorization: Bearer ${SEMAPHORE_API_TOKEN}
            parameters:
              limit: "5"
            template: |
              <ul class="list list-gap-10">
                {{ $i := 0 -}}
                {{ range .JSON.Array "" -}}
                {{ if lt $i 3 -}}
                {{ $i = add $i 1 -}}
                  {{ $status := .String "status" -}}
                  <li>
                    <div class="flex justify-between">
                      <span class="size-h4">{{ .String "tpl_alias" }}</span>
                      <span class="{{ if eq $status "success" }}color-positive{{ else if eq $status "error" }}color-negative{{ else if eq $status "running" }}color-highlight{{ else }}color-subtext{{ end }} size-h6">{{ $status }}</span>
                    </div>
                    <ul class="list-horizontal-text size-h6">
                      <li {{ .String "created" | parseTime "rfc3339" | toRelativeTime }}></li>
                    </ul>
                  </li>
                {{ end -}}
                {{ end -}}
              </ul>

  - name: Exposed Services
    columns:
      - size: small
        widgets:
          - type: custom-api
            title: Cloudflare Tunnels
            cache: 5m
            url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/cfd_tunnel/${CLOUDFLARE_TUNNEL_ID}/configurations
            headers:
              Authorization: Bearer ${CLOUDFLARE_API_KEY}
            template: |
              <ul class="list list-gap-10">
                {{ range .JSON.Array "result.config.ingress" -}}
                  {{ if .String "hostname" -}}
                  <li>
                    <a class="size-h4 color-highlight" href="https://{{ .String "hostname" }}" target="_blank">{{ .String "hostname" }}</a>
                    <ul class="list-horizontal-text size-h6">
                      <li class="color-subtext">{{ .String "service" }}</li>
                    </ul>
                  </li>
                  {{ end -}}
                {{ end -}}
              </ul>

          - type: custom-api
            title: Uptime Kuma - Exposed
            cache: 1m
            url: http://192.168.178.30:3001/api/status-page/heartbeat/exposed
            template: |
              {{ $up := 0 }}{{ $down := 0 -}}
              {{ range .JSON.Array "heartbeatList.@values.#.#-1" -}}
                {{ if eq (.Int "status") 1 }}{{ $up = add $up 1 }}{{ else }}{{ $down = add $down 1 }}{{ end -}}
              {{ end -}}
              <div class="flex justify-between text-center">
                <div>
                  <div class="color-positive size-h3">{{ $up }}</div>
                  <div class="size-h6">ONLINE</div>
                </div>
                <div>
                  <div class="{{ if gt $down 0 }}color-negative{{ else }}color-highlight{{ end }} size-h3">{{ $down }}</div>
                  <div class="size-h6">OFFLINE</div>
                </div>
              </div>

