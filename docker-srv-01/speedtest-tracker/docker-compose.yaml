services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:v1.15.0-ls171
    container_name: speedtest-tracker
    restart: unless-stopped
    ports:
      - "8765:80"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - APP_KEY=${SPEEDTEST_APP_KEY}
      - SPEEDTEST_SCHEDULE=0 */3 * * *
      - DISPLAY_TIMEZONE=Europe/Berlin
    volumes:
      - /mnt/docker/speedtest-tracker/config:/config
