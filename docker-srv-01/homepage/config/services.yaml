# For configuration options and examples, please see:
# https://gethomepage.dev/latest/configs/services

- Networking:
  - Fritz!Box-Main:
      href: http://192.168.178.1
      icon: fritzbox.png
      description: FRITZ!Box
      siteMonitor: http://192.168.178.1
      widget:
        type: fritzbox
        url: http://192.168.178.1
  - Fritz!Box-Tony:
      href: http://192.168.178.2
      icon: fritzbox.png
      description: FRITZ!Box Tony
      siteMonitor: http://192.168.178.2
      widget:
        type: fritzbox
        url: http://192.168.178.2
  - Traefik:
      href: https://traefik.home.soniiit.net/dashboard/
      icon: https://icon.icepanel.io/Technology/svg/Traefik-Proxy.svg
      description: Traefik
      siteMonitor: https://traefik.home.soniiit.net
      widget:
        type: traefik
        url: https://traefik.home.soniiit.net/
        username: "{{HOMEPAGE_VAR_TRAEFIK_USER}}"
        password: "{{HOMEPAGE_VAR_TRAEFIK_PASSWORD}}"

- Infrastructure:
  - Proxmox:
      href: https://proxmox.home.soniiit.net/
      icon: proxmox.png
      description: PVE-SRV-01
      siteMonitor: https://proxmox.home.soniiit.net/
      widget:
        type: proxmox
        url: https://192.168.178.6:8006
        username: "{{HOMEPAGE_VAR_PROXMOX_USER}}"
        password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
        node: pve-srv-01

- Management:
  - Portainer:
      href: https://portainer.home.soniiit.net/
      icon: portainer.png
      description: Portainer
      siteMonitor: https://portainer.home.soniiit.net/
      widget:
        type: portainer
        url: https://portainer.home.soniiit.net/
        env: 3
        kubernetes: false # optional, defaults to false
        key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"

- Media Stack:
  - Jellyfin:
      href: https://jellyfin.home.soniiit.net
      icon: jellyfin.png
      description: Jellyfin
      siteMonitor: https://jellyfin.home.soniiit.net
      widget:
        type: jellyfin
        url: http://192.168.178.98:8096
        key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
        enableBlocks: true # optional, defaults to false
        enableNowPlaying: true # optional, defaults to true
        enableUser: true # optional, defaults to false
        enableMediaControl: false # optional, defaults to true
        showEpisodeNumber: true # optional, defaults to false
        expandOneStreamToTwoRows: false # optional, defaults to true
  - Seerr:
      href: https://jellyseerr.home.soniiit.net
      icon: jellyseerr.png
      description: Seerr
      siteMonitor: https://jellyseerr.home.soniiit.net
