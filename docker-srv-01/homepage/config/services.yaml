        type: jellyseerr
        url: http://192.168.178.98:5055
        key: "{{HOMEPAGE_VAR_JELLYSEERR_KEY}}"
  - Sonarr:
      href: https://sonarr.home.soniiit.net
      icon: sonarr.png
      description: Sonarr
      siteMonitor: https://sonarr.home.soniiit.net
      widget:
        type: sonarr
        url: http://192.168.178.98:8989
        key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
