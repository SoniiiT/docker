- Management:
  - Portainer:
      href: https://192.168.178.30:9443/
      icon: portainer.png
      description: Portainer
      siteMonitor: https://192.168.178.30:9443/
      widget:
        type: portainer
        url: https://192.168.178.30:9443/
        env: 3
        kubernetes: false # optional, defaults to false
        key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"

- Media Stack:
  - Jellyfin:
      href: http://192.168.178.98:8096
      icon: jellyfin.png
      description: Jellyfin
      siteMonitor: http://192.168.178.98:8096
      widget:
        type: jellyfin
        url: http://192.168.178.98:8096
        key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
