- Management:
  - Portainer:
      href: https://portainer.home.soniiit.net/
      icon: portainer.png
      description: Portainer
      siteMonitor: https://portainer.home.soniiit.net/
      widget:
        type: portainer
        url: https://portainer.home.soniiit.net/
        env: 1
        kubernetes: true # optional, defaults to false
        key: 
  - TrueNAS:
      href: https://truenas.home.soniiit.net/
      icon: truenas.png
      description: TrueNAS
      siteMonitor: https://truenas.home.soniiit.net/ui/
      widget:
        type: truenas
        url: https://truenas.home.soniiit.net/
        key:  # not required if using username / password
        enablePools: true # optional, defaults to false
        nasType: scale # defaults to scale, must be set to 'core' if using enablePools with TrueNAS Core

