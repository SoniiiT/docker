http:
  routers:
    dokploy:
      rule: Host(`dokploy.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: dokploy-svc
      middlewares:
        - secureHeaders@file

  services:
    dokploy-svc:
      loadBalancer:
        servers:
          - url: http://192.168.178.32:3000
        passHostHeader: true