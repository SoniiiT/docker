http:
  routers:
    audiobookshelf:
      rule: Host(`audiobookshelf.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: audiobookshelf-svc
      middlewares:
        - secureHeaders@file

  services:
    audiobookshelf-svc:
      loadBalancer:
        servers:
          - url: http://192.168.178.98:13378
        passHostHeader: true
