http:
  routers:
    kapowarr:
      rule: Host(`kapowarr.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: kapowarr-svc
      middlewares:
        - secureHeaders@file

  services:
    kapowarr-svc:
      loadBalancer:
        servers:
          - url: http://192.168.178.98:5656
        passHostHeader: true
