http:
  routers:
    jellyseerr:
      rule: Host(`jellyseerr.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: jellyseerr-svc
      middlewares:
        - secureHeaders@file

  services:
    jellyseerr-svc:
      loadBalancer:
        servers:
          - url: http://192.168.178.98:5055
        passHostHeader: true