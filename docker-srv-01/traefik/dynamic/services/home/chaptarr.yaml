http:
  routers:
    chaptarr:
      rule: Host(`chaptarr.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: chaptarr-svc
      middlewares:
        - secureHeaders@file

  services:
    chaptarr-svc:
      loadBalancer:
        servers:
          - url: http://192.168.178.98:8789
        passHostHeader: true
