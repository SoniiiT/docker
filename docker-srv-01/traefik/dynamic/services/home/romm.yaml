http:
  routers:
    romm:
      rule: Host(`romm.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: romm-svc
      middlewares:
        - secureHeaders@file

  services:
    romm-svc:
      loadBalancer:
        servers:
          - url: http://192.168.178.98:8008
        passHostHeader: true
