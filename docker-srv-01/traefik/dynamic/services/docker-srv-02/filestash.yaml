http:
  routers:
    filestash:
      rule: Host(`filestash.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: filestash-svc
      middlewares:
        - secureHeaders@file

  services:
    filestash-svc:
      loadBalancer:
        servers:
          - url: http://192.168.178.30:8334
        passHostHeader: true