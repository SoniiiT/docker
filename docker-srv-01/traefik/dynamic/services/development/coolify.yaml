http:
  routers:
    coolify:
      rule: Host(`coolify.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: coolify-svc
      middlewares:
        - secureHeaders@file

  services:
    coolify-svc:
      loadBalancer:
        servers:
          - url: http://192.168.178.61:8000 
        passHostHeader: true