http:
  routers:
    omanda:
      rule: Host(`omanda.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: omanda-svc
      middlewares:
        - pveHeaders@file

  services:
    omanda-svc:
      loadBalancer:
        servers:
          - url: https://192.168.178.51:8043
        passHostHeader: true
        serversTransport: omanda-transport

  serversTransports:
    omanda-transport:
      insecureSkipVerify: true