http:
  routers:
    omada:
      rule: Host(`omada.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: omada-svc
      middlewares:
        - pveHeaders@file

  services:
    omada-svc:
      loadBalancer:
        servers:
          - url: https://192.168.178.51:8043
        passHostHeader: true
        serversTransport: omada-transport

  serversTransports:
    omada-transport:
      insecureSkipVerify: true