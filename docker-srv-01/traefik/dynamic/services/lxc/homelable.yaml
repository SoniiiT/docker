http:
  routers:
    homelable:
      rule: Host(`homelable.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: homelable-svc
      middlewares:
        - secureHeaders@file

  services:
    homelable-svc:
      loadBalancer:
        servers:
          - url: http://192.168.178.52:3000
        passHostHeader: true
