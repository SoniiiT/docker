http:
  routers:
    cosmos:
      rule: Host(`cosmos.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: cosmos-svc
      middlewares:
        - pveHeaders@file

  services:
    cosmos-svc:
      loadBalancer:
        servers:
          - url: https://192.168.178.57
        passHostHeader: true
        serversTransport: cosmos-transport

  serversTransports:
    cosmos-transport:
      insecureSkipVerify: true