http:
  routers:
    test:
      rule: Host(`test.home.soniiit.net`)
      entryPoints: [websecure]
      tls:
        certResolver: leprod
      service: test-svc
      middlewares:
        - secureHeaders@file

  services:
    test-svc:
      loadBalancer:
        servers:
          - url: http://192.168.178.50:18966
        passHostHeader: true