networks:
  proxy:
    external: true
    name: traefik_proxy

services:
  portainer-mcp:
    image: portainer/portainer-mcp:2.43
    container_name: portainer-mcp
    restart: unless-stopped
    networks: [proxy]
    environment:
      PORTAINER_URL: ${PORTAINER_URL:?PORTAINER_URL is required}
      PORTAINER_TLS_VERIFY: "0"
      PORTAINER_MCP_TRANSPORT: http
      PORTAINER_MCP_HTTP_PORT: "17717"
      PORTAINER_MCP_AUTH_TOKEN: ${PORTAINER_MCP_AUTH_TOKEN:?PORTAINER_MCP_AUTH_TOKEN is required}
      PORTAINER_MCP_ALLOWED_HOSTS: portainer.mcp.soniiit.net
      PORTAINER_MCP_TRUST_PROXY_TLS: "1"
      PORTAINER_MCP_FORWARDED_ALLOW_IPS: ${PORTAINER_MCP_FORWARDED_ALLOW_IPS:?PORTAINER_MCP_FORWARDED_ALLOW_IPS is required}
      PORTAINER_PROFILES: BASE,DOCKER
      PORTAINER_READ_ONLY: "1"
      PORTAINER_NO_PROXY: "1"
      PORTAINER_EXPOSE_ENV_VALUES: "0"
