services:
  kestra:
    image: kestra/kestra:v0.22.5
    pull_policy: always
    container_name: kestra
    stdin_open: true
    tty: true
    ports:
      - 1337:8080
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
      - /mnt/docker-compose/kestra/data/:/app/data
    command: server local
    restart: unless-stopped
    environment:
      - SECRET_SSH_KEY=${SECRET_SSH_KEY}