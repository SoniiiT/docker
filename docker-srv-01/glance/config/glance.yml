server:
  assets-path: /app/assets

theme:
  custom-css-file: /assets/user.css

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h

          - type: calendar
            first-day-of-week: monday

          - type: weather
            location: Stuttgart, Germany
            units: metric
            hour-format: 24h

      - size: full
        widgets:
          - type: search
            search-engine: google
            bangs:
              - title: YouTube
                shortcut: "!yt"
                url: https://www.youtube.com/results?search_query={QUERY}
              - title: GitHub
                shortcut: "!gh"
                url: https://github.com/search?q={QUERY}
              - title: Docker Hub
                shortcut: "!dh"
                url: https://hub.docker.com/search?q={QUERY}
              - title: Reddit
                shortcut: "!r"
                url: https://www.reddit.com/search/?q={QUERY}

          - type: videos
            title: YouTube
            channels:
              - UC9x0AN7BWHpCDHSm9NiJFJQ  # NetworkChuck
              - UCivJ3eKyApxatQJNt7M18jA  # Techno Tim
              - UC7c3Kb6jYCRj4JOHHZTxKsQ  # GitHub
              # VirtualizationHowto: find ID at youtube.com/@VirtualizationHowto (view-source, search externalId)
              # Christian Lempa: find ID at youtube.com/@christianlempa (view-source, search externalId)
              # VS Code: find ID at youtube.com/@code (view-source, search externalId)
            collapse-after-rows: 3
            video-url-template: https://www.youtube.com/watch?v={VIDEO-ID}

          - type: group
            widgets:
              - type: bookmarks
                title: Seite 1
                groups:
                  - title: Entertainment
                    links:
                      - title: YouTube
                        url: https://youtube.com
                        icon: si:youtube
                      - title: Netflix
                        url: https://netflix.com
                        icon: si:netflix
                      - title: Jellyfin
                        url: http://192.168.178.98:8096
                        icon: si:jellyfin
                      - title: Jellyseerr
                        url: http://192.168.178.98:5055
                        icon: si:jellyseerr

                  - title: Shopping
                    links:
                      - title: Amazon
                        url: https://amazon.de
                        icon: si:amazon
                      - title: eBay
                        url: https://ebay.de
                        icon: si:ebay
                      - title: Wallos
                        url: ${WALLOS_URL}
                        icon: si:wallos

                  - title: Social
                    links:
                      - title: Reddit
                        url: https://reddit.com
                        icon: si:reddit
                      - title: Twitter/X
                        url: https://twitter.com
                        icon: si:x
                      - title: Discord
                        url: https://discord.com
                        icon: si:discord

              - type: bookmarks
                title: Seite 2
                groups:
                  - title: Learning & Career
                    links:
                      - title: GitHub
                        url: https://github.com
                        icon: si:github
                      - title: Stack Overflow
                        url: https://stackoverflow.com
                        icon: si:stackoverflow
                      - title: Confluence
                        url: https://soniiit.atlassian.net/wiki
                        icon: si:confluence

                  - title: AI & Dev Tools
                    links:
                      - title: ChatGPT
                        url: https://chatgpt.com
                        icon: si:openai
                      - title: Replit
                        url: https://replit.com
                        icon: si:replit
                      - title: VS Code Online
                        url: https://vscode.dev
                        icon: si:visualstudiocode

                  - title: Finance & Crypto
                    links:
                      - title: Kraken
                        url: https://kraken.com
                        icon: si:kraken
                      - title: Binance
                        url: https://binance.com
                        icon: si:binance
                      - title: Coingecko
                        url: https://coingecko.com
                        icon: si:coingecko

      - size: small
        widgets:
          - type: group
            widgets:
              - type: custom-api
                title: Wallos – Subscriptions
                url: ${WALLOS_URL}/api/subscriptions/get_subscriptions.php
                cache: 1h
                parameters:
                  apiKey: ${WALLOS_API_KEY}
                  sort: next_payment
                  state: 0
                  convert_currency: true
                template: |
                  <ul class="list list-gap-10 collapsible-container" data-collapse-after="6">
                    {{ range .JSON.Array "subscriptions" }}
                      <li>
                        <div class="flex justify-between">
                          <span class="size-h4">{{ .String "name" }}</span>
                          <span class="color-highlight shrink-0">{{ .Float "price" | printf "%.2f" }} €</span>
                        </div>
                        <ul class="list-horizontal-text">
                          <li {{ .String "next_payment" | parseTime "2006-01-02" | toRelativeTime }}></li>
                          <li>{{ .String "category_name" }}</li>
                        </ul>
                      </li>
                    {{ end }}
                  </ul>

              - type: custom-api
                title: GitHub Actions
                url: https://api.github.com/repos/SoniiiT/docker/actions/runs
                cache: 5m
                parameters:
                  exclude_pull_requests: true
                  per_page: 8
                headers:
                  Authorization: Bearer ${GITHUB_TOKEN}
                  Accept: application/vnd.github.v3+json
                  User-Agent: Glance-Dashboard
                template: |
                  <ul class="list list-gap-14 collapsible-container" data-collapse-after="5">
                    {{ range .JSON.Array "workflow_runs" }}
                      {{ $conclusion := .String "conclusion" }}
                      <li>
                        <a class="size-h4 color-primary-if-not-visited" href="{{ .String "html_url" }}">{{ .String "display_title" }}</a>
                        <ul class="list-horizontal-text">
                          <li>{{ .String "updated_at" | parseTime "rfc3339" | toRelativeTime }}</li>
                          <li>{{ .String "name" }}</li>
                          <li>
                            {{ if eq $conclusion "success" }}
                              <svg width="16" height="16" fill="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd" /></svg>
                            {{ else if eq $conclusion "failure" }}
                              <svg width="16" height="16" fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" /></svg>
                            {{ else }}
                              <svg width="16" height="16" fill="var(--color-subtext)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm-.75-4.75a.75.75 0 0 0 1.5 0V8.75a.75.75 0 0 0-1.5 0v4.5Zm.75-8.5A1 1 0 1 0 10 7a1 1 0 0 0 0-2Z" clip-rule="evenodd" /></svg>
                            {{ end }}
                          </li>
                        </ul>
                      </li>
                    {{ end }}
                  </ul>

          - type: custom-api
            title: Speedtest
            cache: 30m
            url: http://192.168.178.30:8765/api/speedtest/latest
            template: |
              <div class="flex justify-between text-center">
                <div>
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.download" | printf "%.0f" }}</div>
                  <div class="size-h6">DOWN</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.upload" | printf "%.0f" }}</div>
                  <div class="size-h6">UP</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.ping" | printf "%.0f" }}</div>
                  <div class="size-h6">PING</div>
                </div>
              </div>

          - type: group
            widgets:
              - type: custom-api
                title: Markets
                cache: 30m
                url: https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=eur&include_market_cap=true&include_24hr_vol=true
                template: |
                  <ul class="list list-gap-14">
                    <li>
                      <div class="flex justify-between">
                        <span class="size-h4">Bitcoin</span>
                        <span class="color-highlight">€{{ .JSON.Float "bitcoin.eur" | printf "%.0f" }}</span>
                      </div>
                      <ul class="list-horizontal-text size-h6">
                        <li>BTC</li>
                      </ul>
                    </li>
                    <li>
                      <div class="flex justify-between">
                        <span class="size-h4">Ethereum</span>
                        <span class="color-highlight">€{{ .JSON.Float "ethereum.eur" | printf "%.0f" }}</span>
                      </div>
                      <ul class="list-horizontal-text size-h6">
                        <li>ETH</li>
                      </ul>
                    </li>
                  </ul>

              - type: custom-api
                title: Nearby Aircraft
                cache: 5m
                url: https://opensky-network.org/api/states/all
                parameters:
                  lamin: "48.55"
                  lamax: "49.05"
                  lomin: "8.93"
                  lomax: "9.43"
                template: |
                  {{ $states := .JSON.Array "states" }}
                  {{ $count := len $states }}
                  <div class="margin-block-2">
                    <div class="size-h6">FLUGZEUGE IN DER NÄHE: {{ $count }}</div>
                  </div>
                  {{ if gt $count 0 }}
                    <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
                      {{ range $states }}
                        {{ $callsign := .String "1" }}
                        {{ $icao24 := .String "0" }}
                        {{ $origin := .String "2" }}
                        {{ $onGround := .Bool "8" }}
                        {{ $altitude := .Float "7" }}
                        {{ $speed := .Float "9" }}
                        <li>
                          <div class="flex justify-between">
                            <span class="size-h4 color-highlight">{{ if ne $callsign "" }}{{ $callsign | trimSpace }}{{ else }}{{ $icao24 }}{{ end }}</span>
                            {{ if ne $origin "" }}<span class="size-h6 color-subtext">{{ $origin }}</span>{{ end }}
                          </div>
                          <ul class="list-horizontal-text">
                            {{ if $onGround }}<li>Am Boden</li>{{ else }}
                              {{ if ne $altitude 0.0 }}<li>{{ printf "%.0f" $altitude }}m</li>{{ end }}
                              {{ if ne $speed 0.0 }}<li>{{ printf "%.0f" $speed }}m/s</li>{{ end }}
                            {{ end }}
                          </ul>
                        </li>
                      {{ end }}
                    </ul>
                  {{ else }}
                    <p class="color-subtext size-h5">Keine Flugzeuge in der Nähe</p>
                  {{ end }}

  - name: Services
    columns:
      - size: small
        widgets:
          - type: monitor
            title: Infrastruktur
            cache: 1m
            sites:
              - title: Traefik
                url: https://traefik.home.soniiit.net/dashboard/
                icon: si:traefik
                basic-auth:
                  username: ${TRAEFIK_USER}
                  password: ${TRAEFIK_PASSWORD}
              - title: Proxmox
                url: https://192.168.178.6:8006/
                allow-insecure: true
                icon: si:proxmox

          - type: custom-api
            title: Docker Servers
            cache: 30s
            url: https://192.168.178.30:9443/api/endpoints
            headers:
              X-API-Key: ${PORTAINER_API_KEY}
            allow-insecure: true
            subrequests:
              srv01:
                url: https://192.168.178.30:9443/api/endpoints/3/docker/containers/json
                parameters:
                  all: "true"
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv01-s:
                url: https://192.168.178.30:9443/api/endpoints/3/docker/containers/json
                parameters:
                  all: "true"
                  filters: '{"status":["exited"]}'
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv01-u:
                url: https://192.168.178.30:9443/api/endpoints/3/docker/containers/json
                parameters:
                  filters: '{"health":["unhealthy"]}'
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv01-st:
                url: https://192.168.178.30:9443/api/endpoints/3/docker/containers/json
                parameters:
                  filters: '{"health":["starting"]}'
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv02:
                url: https://192.168.178.30:9443/api/endpoints/4/docker/containers/json
                parameters:
                  all: "true"
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv02-s:
                url: https://192.168.178.30:9443/api/endpoints/4/docker/containers/json
                parameters:
                  all: "true"
                  filters: '{"status":["exited"]}'
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv02-u:
                url: https://192.168.178.30:9443/api/endpoints/4/docker/containers/json
                parameters:
                  filters: '{"health":["unhealthy"]}'
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv02-st:
                url: https://192.168.178.30:9443/api/endpoints/4/docker/containers/json
                parameters:
                  filters: '{"health":["starting"]}'
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv03:
                url: https://192.168.178.30:9443/api/endpoints/5/docker/containers/json
                parameters:
                  all: "true"
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv03-s:
                url: https://192.168.178.30:9443/api/endpoints/5/docker/containers/json
                parameters:
                  all: "true"
                  filters: '{"status":["exited"]}'
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv03-u:
                url: https://192.168.178.30:9443/api/endpoints/5/docker/containers/json
                parameters:
                  filters: '{"health":["unhealthy"]}'
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
              srv03-st:
                url: https://192.168.178.30:9443/api/endpoints/5/docker/containers/json
                parameters:
                  filters: '{"health":["starting"]}'
                headers:
                  X-API-Key: ${PORTAINER_API_KEY}
                allow-insecure: true
            template: |
              {{ $root := . }}
              <ul class="list list-gap-14">
              {{ range .JSON.Array "" -}}
                {{ $id := .Int "Id" -}}
                {{ $name := .String "Name" -}}
                {{ $online := eq (.Int "Status") 1 -}}
                {{ $k := "srv01" }}{{ $ks := "srv01-s" }}{{ $ku := "srv01-u" }}{{ $kst := "srv01-st" -}}
                {{ if eq $id 4 }}{{ $k = "srv02" }}{{ $ks = "srv02-s" }}{{ $ku = "srv02-u" }}{{ $kst = "srv02-st" }}{{ end -}}
                {{ if eq $id 5 }}{{ $k = "srv03" }}{{ $ks = "srv03-s" }}{{ $ku = "srv03-u" }}{{ $kst = "srv03-st" }}{{ end -}}
                {{ $total := 0 }}{{ $stoppedCnt := 0 }}{{ $unhealthyCnt := 0 }}{{ $startingCnt := 0 -}}
                {{ if $online -}}
                  {{ $sr := $root.Subrequest $k -}}
                  {{ $total = len ($sr.JSON.Array "") -}}
                  {{ $srs := $root.Subrequest $ks -}}
                  {{ $stoppedCnt = len ($srs.JSON.Array "") -}}
                  {{ $sru := $root.Subrequest $ku -}}
                  {{ $unhealthyCnt = len ($sru.JSON.Array "") -}}
                  {{ $srst := $root.Subrequest $kst -}}
                  {{ $startingCnt = len ($srst.JSON.Array "") -}}
                {{ end -}}
                {{ $healthyCnt := sub (sub (sub $total $stoppedCnt) $unhealthyCnt) $startingCnt -}}
                <li>
                  <div class="flex items-center justify-between">
                    <span class="color-highlight size-h4">{{ $name }}</span>
                    {{ if $online }}<span class="color-positive size-h6">● online</span>{{ else }}<span class="color-negative size-h6">● offline</span>{{ end }}
                  </div>
                  {{ if $online -}}
                  <ul class="list-horizontal-text size-h6">
                    <li>{{ $total }} total</li>
                    <li class="color-positive">{{ $healthyCnt }} healthy</li>
                    {{ if gt $startingCnt 0 }}<li class="color-highlight">{{ $startingCnt }} starting</li>{{ end }}
                    {{ if gt $unhealthyCnt 0 }}<li class="color-warn">{{ $unhealthyCnt }} unhealthy</li>{{ end }}
                    {{ if gt $stoppedCnt 0 }}<li class="color-negative">{{ $stoppedCnt }} stopped</li>{{ end }}
                  </ul>
                  {{ end -}}
                </li>
              {{ end -}}
              </ul>

          - type: custom-api
            title: Uptime Kuma – Services
            cache: 1m
            url: http://192.168.178.30:3001/api/status-page/heartbeat/services
            template: |
              {{ $up := 0 }}{{ $down := 0 -}}
              {{ range .JSON.Array "heartbeatList.@values.#.#-1" -}}
                {{ if eq (.Int "status") 1 }}{{ $up = add $up 1 }}{{ else }}{{ $down = add $down 1 }}{{ end -}}
              {{ end -}}
              <div class="flex justify-between text-center">
                <div>
                  <div class="color-positive size-h3">{{ $up }}</div>
                  <div class="size-h6">ONLINE</div>
                </div>
                <div>
                  <div class="{{ if gt $down 0 }}color-negative{{ else }}color-highlight{{ end }} size-h3">{{ $down }}</div>
                  <div class="size-h6">OFFLINE</div>
                </div>
              </div>

          - type: custom-api
            title: GitHub – Trending Diese Woche
            cache: 6h
            template: |
              {{ $weekAgo := offsetNow "-168h" | formatTime "2006-01-02" -}}
              {{ $repos := newRequest "https://api.github.com/search/repositories"
                  | withParameter "q" (concat "created:>" $weekAgo)
                  | withParameter "sort" "stars"
                  | withParameter "order" "desc"
                  | withParameter "per_page" "5"
                  | withHeader "Authorization" "Bearer ${GITHUB_TOKEN}"
                  | withHeader "Accept" "application/vnd.github.v3+json"
                  | withHeader "User-Agent" "Glance-Dashboard"
                  | getResponse -}}
              <ul class="list list-gap-10">
                {{ range $repos.JSON.Array "items" -}}
                  <li>
                    <a class="size-h4 color-highlight" href="{{ .String "html_url" }}" target="_blank">{{ .String "full_name" }}</a>
                    <ul class="list-horizontal-text size-h6">
                      <li>⭐ {{ .Int "stargazers_count" | formatNumber }}</li>
                      <li>{{ .String "language" }}</li>
                    </ul>
                  </li>
                {{ end -}}
              </ul>

      - size: full
        widgets:
          - type: group
            widgets:
              - type: custom-api
                title: Jellyfin
                cache: 1h
                url: http://192.168.178.98:8096/Items/Counts
                headers:
                  X-Emby-Token: ${JELLYFIN_API_KEY}
                template: |
                  <div class="flex justify-between text-center">
                    <div>
                      <div class="color-highlight size-h3">{{ .JSON.Int "MovieCount" | formatNumber }}</div>
                      <div class="size-h6">FILME</div>
                    </div>
                    <div>
                      <div class="color-highlight size-h3">{{ .JSON.Int "SeriesCount" | formatNumber }}</div>
                      <div class="size-h6">SERIEN</div>
                    </div>
                    <div>
                      <div class="color-highlight size-h3">{{ .JSON.Int "EpisodeCount" | formatNumber }}</div>
                      <div class="size-h6">EPISODEN</div>
                    </div>
                  </div>

              - type: custom-api
                title: Sonarr
                cache: 30m
                url: http://192.168.178.98:8989/api/v3/series
                headers:
                  X-Api-Key: ${SONARR_API_KEY}
                subrequests:
                  missing:
                    url: http://192.168.178.98:8989/api/v3/wanted/missing
                    parameters:
                      pageSize: "1"
                    headers:
                      X-Api-Key: ${SONARR_API_KEY}
                template: |
                  {{ $total := len (.JSON.Array "") -}}
                  {{ $missing := (.Subrequest "missing").JSON.Int "totalRecords" -}}
                  <div class="flex justify-between text-center">
                    <div>
                      <div class="color-highlight size-h3">{{ $total }}</div>
                      <div class="size-h6">SERIEN</div>
                    </div>
                    <div>
                      <div class="color-highlight size-h3{{ if gt $missing 0 }} color-negative{{ end }}">{{ $missing }}</div>
                      <div class="size-h6">FEHLEND</div>
                    </div>
                  </div>

              - type: custom-api
                title: Radarr
                cache: 30m
                url: http://192.168.178.98:7878/api/v3/movie
                headers:
                  X-Api-Key: ${RADARR_API_KEY}
                subrequests:
                  missing:
                    url: http://192.168.178.98:7878/api/v3/wanted/missing
                    parameters:
                      pageSize: "1"
                    headers:
                      X-Api-Key: ${RADARR_API_KEY}
                template: |
                  {{ $total := len (.JSON.Array "") -}}
                  {{ $missing := (.Subrequest "missing").JSON.Int "totalRecords" -}}
                  <div class="flex justify-between text-center">
                    <div>
                      <div class="color-highlight size-h3">{{ $total }}</div>
                      <div class="size-h6">FILME</div>
                    </div>
                    <div>
                      <div class="color-highlight size-h3{{ if gt $missing 0 }} color-negative{{ end }}">{{ $missing }}</div>
                      <div class="size-h6">FEHLEND</div>
                    </div>
                  </div>

              - type: custom-api
                title: Jellyseerr
                cache: 5m
                url: http://192.168.178.98:5055/api/v1/request/count
                headers:
                  X-Api-Key: ${JELLYSEERR_API_KEY}
                template: |
                  {{ $pending := .JSON.Int "pending" -}}
                  {{ $declined := .JSON.Int "declined" -}}
                  {{ $unavailable := .JSON.Int "unavailable" -}}
                  <div class="flex justify-between text-center">
                    <div>
                      <div class="color-positive size-h3">{{ .JSON.Int "available" }}</div>
                      <div class="size-h6">VERFÜGBAR</div>
                    </div>
                    <div>
                      <div class="color-highlight size-h3">{{ .JSON.Int "processing" }}</div>
                      <div class="size-h6">VERARBEITUNG</div>
                    </div>
                    <div>
                      <div class="{{ if gt $pending 0 }}color-warn{{ else }}color-highlight{{ end }} size-h3">{{ $pending }}</div>
                      <div class="size-h6">ANGEFRAGT</div>
                    </div>
                  </div>
                  <div class="flex justify-between text-center margin-top-10">
                    <div>
                      <div class="{{ if gt $declined 0 }}color-negative{{ else }}color-highlight{{ end }} size-h3">{{ $declined }}</div>
                      <div class="size-h6">ABGELEHNT</div>
                    </div>
                    <div>
                      <div class="{{ if gt $unavailable 0 }}color-negative{{ else }}color-highlight{{ end }} size-h3">{{ $unavailable }}</div>
                      <div class="size-h6">NICHT VERFÜGBAR</div>
                    </div>
                    <div>
                      <div class="color-highlight size-h3">{{ .JSON.Int "total" }}</div>
                      <div class="size-h6">GESAMT</div>
                    </div>
                  </div>

          - type: group
            widgets:
              - type: bookmarks
                title: Seite 1
                groups:
                  - title: DNS
                    links:
                      - title: DNS Server
                        url: http://example.example.de
                        icon: si:bind9
                  - title: IP
                    links:
                      - title: IP-Übersicht
                        url: http://192.168.178.0
                        icon: si:cisco
              - type: bookmarks
                title: Seite 2
                groups:
                  - title: Teleport
                    links:
                      - title: Teleport
                        url: https://teleport.example.de
                        icon: si:teleport

      - size: small
        widgets:
          - type: custom-api
            title: Proxmox – Status
            cache: 1m
            url: https://192.168.178.6:8006/api2/json/nodes/pve-srv-01/status
            allow-insecure: true
            headers:
              Authorization: PVEAPIToken=${PROXMOX_API_TOKEN}
            template: |
              {{ $cpu := mul (.JSON.Float "data.cpu") 100 -}}
              {{ $memUsed := .JSON.Float "data.memory.used" -}}
              {{ $memTotal := .JSON.Float "data.memory.total" -}}
              {{ $memPct := mul (div $memUsed $memTotal) 100 -}}
              {{ $diskUsed := .JSON.Float "data.rootfs.used" -}}
              {{ $diskTotal := .JSON.Float "data.rootfs.total" -}}
              {{ $diskPct := mul (div $diskUsed $diskTotal) 100 -}}
              <div class="flex justify-between text-center">
                <div>
                  <div class="color-highlight size-h3">{{ $cpu | printf "%.0f" }}%</div>
                  <div class="size-h6">CPU</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ $memPct | printf "%.0f" }}%</div>
                  <div class="size-h6">RAM</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ $diskPct | printf "%.0f" }}%</div>
                  <div class="size-h6">DISK</div>
                </div>
              </div>

          - type: custom-api
            title: N8N – Aktive Workflows
            cache: 5m
            url: http://192.168.178.29:5678/api/v1/workflows
            headers:
              X-N8N-API-KEY: ${N8N_API_KEY}
            template: |
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
                {{ range .JSON.Array "data" -}}
                  {{ if .Bool "active" -}}
                  <li>
                    <span class="size-h4 color-highlight">{{ .String "name" }}</span>
                    <ul class="list-horizontal-text size-h6">
                      <li class="color-positive">aktiv</li>
                    </ul>
                  </li>
                  {{ end -}}
                {{ end -}}
              </ul>

          - type: custom-api
            title: WireGuard Tunnels
            cache: 1m
            url: http://192.168.178.45:10086/api/getWireguardConfigurations
            headers:
              wg-dashboard-apikey: ${WGD_API_KEY}
            template: |
              <ul class="list list-gap-14">
                {{ range .JSON.Array "data" -}}
                  {{ $total := .Int "TotalPeers" -}}
                  {{ $connected := .Int "ConnectedPeers" -}}
                  {{ $disconnected := sub $total $connected -}}
                  <li>
                    <div class="flex justify-between">
                      <span class="size-h4 color-highlight">{{ .String "Name" }}</span>
                    </div>
                    <ul class="list-horizontal-text size-h6">
                      <li class="color-positive">{{ $connected }} verbunden</li>
                      <li class="color-subtext">{{ $disconnected }} getrennt</li>
                    </ul>
                  </li>
                {{ end -}}
              </ul>

          - type: custom-api
            title: Semaphore – Letzte Runs
            cache: 2m
            url: http://192.168.178.50:3001/api/project/2/tasks
            headers:
              Authorization: Bearer ${SEMAPHORE_API_TOKEN}
            parameters:
              limit: "5"
            template: |
              <ul class="list list-gap-10">
                {{ range .JSON.Array "" -}}
                  {{ $status := .String "status" -}}
                  <li>
                    <div class="flex justify-between">
                      <span class="size-h4">{{ .String "tpl_alias" }}</span>
                      <span class="{{ if eq $status "success" }}color-positive{{ else if eq $status "error" }}color-negative{{ else if eq $status "running" }}color-highlight{{ else }}color-subtext{{ end }} size-h6">{{ $status }}</span>
                    </div>
                    <ul class="list-horizontal-text size-h6">
                      <li {{ .String "created" | parseTime "rfc3339" | toRelativeTime }}></li>
                    </ul>
                  </li>
                {{ end -}}
              </ul>

