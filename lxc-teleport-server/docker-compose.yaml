version: "3.9"
services:
  teleport:
    image: public.ecr.aws/gravitational/teleport-distroless:17.7.1
    container_name: teleport
    restart: unless-stopped
    ports:
      - "3080:3080"  # Web-UI (HTTP hinter Traefik)
      - "3023:3023"  # SSH proxy
      - "3024:3024"  # reverse tunnel
      - "3025:3025"  # auth/proxy multiplex (so wie bei dir vorgesehen)
    volumes:
      - ./config:/etc/teleport
      - ./data:/var/lib/teleport
    environment:
      TZ: Europe/Berlin